name: نسخة احتياطية مشفّرة لمفتاح التوقيع
# تنظيف: حذف الإصدار المسودّة المؤقت بعد أخذ النسخة الاحتياطية.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/key-backup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release delete key-backup-tmp --repo "$GITHUB_REPOSITORY" -y --cleanup-tag || true
