# يبني ملف تثبيت ويندوز (.exe) تلقائياً مع كل تحديث، ويضعه في Actions ← Artifacts
# وعند وضع وسم إصدار (مثل v1.0.0) يُنشر أيضاً في صفحة Releases
name: بناء نسخة سطح المكتب

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'scripts/**']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: تثبيت الأدوات
        run: npm install --no-audit --no-fund
      - name: بناء ملف التثبيت
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: رفع ملف التثبيت
        uses: actions/upload-artifact@v4
        with:
          name: maktaba-sunnah-windows
          path: dist/*.exe
          retention-days: 30
      - name: إرفاقه بالإصدار
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
