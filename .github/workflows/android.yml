name: تطبيق أندرويد
on:
  push:
    branches: [main]
    paths: ['index.html', 'css/**', 'js/**', 'data/**', 'fonts/**', 'icons/**', 'mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: تجهيز ملفات التطبيق
        run: |
          cd mobile
          mkdir -p www
          cp -r ../index.html ../css ../js ../data ../fonts ../icons ../audio ../manifest.webmanifest www/
          npm install --no-audit --no-fund --legacy-peer-deps
          npx cap add android
      - name: الأيقونات والصلاحيات
        run: |
          cd mobile/android/app/src/main
          rm -rf res/mipmap-anydpi-v26
          cp -r ../../../../res/* res/
          # الميكروفون للتسميع وتسجيل التلاوة، والاستعلام عن خدمة التعرف على الكلام
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <queries><intent><action android:name="android.speech.RecognitionService" /></intent><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>#' AndroidManifest.xml
          # خدمة التشغيل في الخلفية + الإضافة الخاصة بالتطبيق
          sed -i 's#</application>#    <service android:name=".PlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>#' AndroidManifest.xml
          J=java/org/waqf/maktabasunnah
          cp ../../../../native/*.java $J/
          ls $J
          grep -n "RECORD_AUDIO\|PlaybackService" AndroidManifest.xml
          # رقم إصدار يزيد مع كل بناء، واسم الإصدار من package.json
          VER=$(node -p "require('../../../../package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" ../../build.gradle
          grep -n "versionCode\|versionName" ../../build.gradle
      - name: بناء APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          cd mobile
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q
          # توقيع ثابت حتى تُثبَّت التحديثات فوق النسخة القديمة دون فقد البيانات
          # المفتاح محفوظ في أسرار المستودع فقط: ANDROID_KEYSTORE_B64 و ANDROID_KEYSTORE_PASS
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "::error::أسرار مفتاح التوقيع غير موجودة"; exit 1; fi
          echo "$KS_B64" | base64 -d > ks.jks; PASS="$KS_PASS"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          VER=$(node -p "require('../package.json').version")
          $BT/apksigner sign --ks ks.jks --ks-key-alias maktaba --ks-pass pass:$PASS --key-pass pass:$PASS --out "../../maktaba-sunnah-$VER.apk" aligned.apk
          rm -f ks.jks
          $BT/apksigner verify --print-certs "../../maktaba-sunnah-$VER.apk" | grep -i sha-256
          ls -la ../../*.apk
      - uses: actions/upload-artifact@v4
        with: { name: maktaba-sunnah-android, path: '*.apk', compression-level: 0 }
      - name: نشر في صفحة الإصدارات (رابط تحميل مباشر)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          overwrite_files: true
          name: تطبيق أندرويد — آخر نسخة
          body: |
            تطبيق «مكتبة القرآن والسنة» لأندرويد — يعمل بدون إنترنت بعد التثبيت.
            طريقة التثبيت: نزّل ملف APK، افتحه، واسمح بالتثبيت من مصادر غير معروفة إذا طُلب منك.
          files: '*.apk'
          make_latest: true
