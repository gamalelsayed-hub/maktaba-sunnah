# ينشر نسخة الويب على GitHub Pages
# قبل أول تشغيل: Settings ← Pages ← Source: GitHub Actions
# (النشر المجاني يتطلب أن يكون المستودع عاماً Public)
name: نشر نسخة الويب

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: تجهيز ملفات الموقع
        run: |
          mkdir site
          cp -r index.html sw.js manifest.webmanifest css js data icons site/
          cp دليل-البرنامج.md site/ || true
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
